services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: site-workflow-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: site_workflow_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${RAG_POSTGRES_PASSWORD:-rag_local_only}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - site_workflow_rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d site_workflow_rag"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  site_workflow_rag_pgdata:
